<header class="site-nav">
    <div class="nav-inner">
        <a class="nav-brand" href="{% if session.get('utente') %}{{ url_for('dashboard') }}{% else %}{{ url_for('index') }}{% endif %}">
            Cursus<span class="nav-mark">✒</span>
        </a>
        <nav class="nav-links">
            <div class="lang-switch" role="group" aria-label="{{ _('Cambia lingua') }}">
                {% for cod in LANGUAGES %}
                <a class="lang-btn{% if get_locale() == cod %} is-active{% endif %}" href="{{ url_for('set_lang', lang=cod, prossima=request.full_path) }}" title="{{ LANGUAGE_NAMES[cod] }}">{{ cod|upper }}</a>
                {% endfor %}
            </div>
            {% if session.get('utente') %}
            <span class="nav-user">{{ session.get('utente') }}</span>
            <a class="nav-link" href="{{ url_for('dashboard') }}">{{ _('Dashboard') }}</a>
            <a class="nav-link" href="{{ url_for('cv_nuovo') }}">{{ _('Nuovo CV') }}</a>
            <a class="nav-link nav-link-outline" href="{{ url_for('logout') }}">{{ _('Esci') }}</a>
            {% else %}
            <a class="nav-link" href="{{ url_for('login') }}">{{ _('Accedi') }}</a>
            <a class="nav-link nav-link-solid" href="{{ url_for('register') }}">{{ _('Registrati') }}</a>
            {% endif %}
        </nav>
    </div>
</header>
