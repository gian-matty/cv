<!doctype html>
<html lang="it">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Compilazione CV</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    </head>

    <body>
        <header class="page-header">
            <p class="eyebrow">CV CREATOR</p>
            <h1>Costruiamo il tuo prossimo passo</h1>
            <p>Compila il profilo con le informazioni che vuoi valorizzare nel tuo curriculum.</p>
        </header>

        <form action="{{ url_for('genera_cv') }}" method="POST" enctype="multipart/form-data">
            <fieldset>
                <legend>Dati Anagrafici e Contatti</legend>
                <div class="form-grid">
                    <label>Nome<input type="text" name="nome" placeholder="Es. Giulia" required /></label>
                    <label>Cognome<input type="text" name="cognome" placeholder="Es. Rossi" required /></label>
                    <label>Email<input type="email" name="email" placeholder="nome@email.it" required /></label>
                </div>
                <div class="telefono-container">
                    <select name="prefisso" id="prefisso" class="prefisso-select" required>
                        <option value="+1">+1</option>
                        <option value="+20">+20</option>
                        <option value="+30">+30</option>
                        <option value="+31">+31</option>
                        <option value="+32">+32</option>
                        <option value="+33">+33</option>
                        <option value="+34">+34</option>
                        <option value="+39" selected>+39</option>
                        <option value="+40">+40</option>
                        <option value="+41">+41</option>
                        <option value="+43">+43</option>
                        <option value="+44">+44</option>
                        <option value="+45">+45</option>
                        <option value="+46">+46</option>
                        <option value="+47">+47</option>
                        <option value="+48">+48</option>
                        <option value="+49">+49</option>
                        <option value="+52">+52</option>
                        <option value="+54">+54</option>
                        <option value="+55">+55</option>
                        <option value="+61">+61</option>
                        <option value="+81">+81</option>
                        <option value="+86">+86</option>
                        <option value="+90">+90</option>
                        <option value="+91">+91</option>
                        <option value="+212">+212</option>
                        <option value="+216">+216</option>
                        <option value="+351">+351</option>
                        <option value="+353">+353</option>
                        <option value="+355">+355</option>
                        <option value="+356">+356</option>
                        <option value="+357">+357</option>
                        <option value="+358">+358</option>
                        <option value="+380">+380</option>
                        <option value="+381">+381</option>
                        <option value="+385">+385</option>
                        <option value="+971">+971</option>
                    </select>
                    <input type="tel" id="telefono" name="telefono" placeholder="Cellulare" required />
                </div>

                <div class="form-grid">
                    <label>Città<input type="text" id="citta" name="citta" placeholder="Inizia a digitare un comune o paese..." autocomplete="off" list="citta-list" required /><datalist id="citta-list"></datalist></label>
                    <label>Indirizzo<input type="text" name="indirizzo" placeholder="Via e numero civico" /></label>
                    <label>Data di nascita<input type="date" name="data_nascita" /></label>
                    <label>Luogo di nascita<input type="text" name="luogo_nascita" placeholder="Città, Paese" /></label>
                    <label>Nazionalità<input type="text" name="nazionalita" placeholder="Es. Italiana" /></label>
                    <label>LinkedIn<input type="url" name="linkedin" placeholder="https://linkedin.com/in/..." /></label>
                    <label>Portfolio / sito web<input type="url" name="portfolio" placeholder="https://..." /></label>
                </div>
                <div class="photo-upload">
                    <label for="foto_profilo">Foto profilo <span>(facoltativa, max 5 MB)</span></label>
                    <input type="file" id="foto_profilo" name="foto_profilo" accept="image/*" />
                    <div id="image-preview" class="image-preview" hidden>
                        <img id="image-preview-img" alt="Anteprima della foto profilo" />
                        <button type="button" id="remove-image" class="link-button">Rimuovi foto</button>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Profilo Personale</legend>
                <select name="titolo_professionale" id="titolo_professionale" required>
                    <option value="" disabled selected>Seleziona la tua professione...</option>

                    <!-- Tecnologia & IT -->
                    <option value="Sviluppatore Software / Software Engineer">Sviluppatore Software / Software Engineer</option>
                    <option value="Web Developer (Front-end / Back-end / Full-stack)">Web Developer (Front-end / Back-end / Full-stack)</option>
                    <option value="Data Analyst / Data Scientist">Data Analyst / Data Scientist</option>
                    <option value="DevOps Engineer">DevOps Engineer</option>
                    <option value="Cybersecurity Specialist">Cybersecurity Specialist</option>
                    <option value="UI/UX Designer">UI/UX Designer</option>
                    <option value="System Administrator / Sistemista">System Administrator / Sistemista</option>

                    <!-- Economia, Amministrazione & Business -->
                    <option value="Contabile / Impiegato Amministrativo">Contabile / Impiegato Amministrativo</option>
                    <option value="Project Manager">Project Manager</option>
                    <option value="Consulente Aziendale">Consulente Aziendale</option>
                    <option value="Responsabile Risorse Umane (HR Manager)">Responsabile Risorse Umane (HR Manager)</option>
                    <option value="Commerciale / Sales Account">Commerciale / Sales Account</option>
                    <option value="Business Analyst">Business Analyst</option>

                    <!-- Marketing & Comunicazione -->
                    <option value="Digital Marketing Specialist">Digital Marketing Specialist</option>
                    <option value="Social Media Manager">Social Media Manager</option>
                    <option value="Content Creator / Copywriter">Content Creator / Copywriter</option>
                    <option value="Graphic Designer">Graphic Designer</option>
                    <option value="PR & Communication Specialist">PR & Communication Specialist</option>
                    <option value="SEO/SEM Specialist">SEO/SEM Specialist</option>

                    <!-- Logistica, Produzione & Artigianato -->
                    <option value="Magazziniere / Responsabile Logistica">Magazziniere / Responsabile Logistica</option>
                    <option value="Operaio Specializzato">Operaio Specializzato</option>
                    <option value="Tecnico Elettricista / Idraulico">Tecnico Elettricista / Idraulico</option>
                    <option value="Controllo Qualità">Controllo Qualità</option>

                    <!-- Vendite & Servizi al Pubblico -->
                    <option value="Addetto alle Vendite / Commesso">Addetto alle Vendite / Commesso</option>
                    <option value="Cameriere / Barman">Cameriere / Barman</option>
                    <option value="Cuoco / Chef">Cuoco / Chef</option>
                    <option value="Receptionist / Addetto all'Accoglienza">Receptionist / Addetto all'Accoglienza</option>
                    <option value="Operatore Customer Care / Call Center">Operatore Customer Care / Call Center</option>

                    <!-- Altro -->
                    <option value="Studente / Neolaureato">Studente / Neolaureato</option>
                    <option value="Freelancer / Libero Professionista">Freelancer / Libero Professionista</option>
                    <option value="Altro">Altro</option>
                </select>

                <div id="box_altro" style="display: none; margin-top: 10px">
                    <input type="text" id="titolo_altro" name="titolo_altro" placeholder="Specifica la tua professione..." />
                </div>

                <label>Profilo professionale<textarea name="descrizione" placeholder="Breve descrizione del tuo profilo professionale..." required></textarea></label>
            </fieldset>

            <fieldset>
                <legend>Istruzione e Formazione</legend>
                <label>Seleziona i titoli di studio posseduti:</label>
                <div class="checkbox-container">
                    {% for titolo in titoli_studio %}
                    <div>
                        <input type="checkbox" name="titolo_studio" value="{{ titolo }}" id="titolo_{{ loop.index }}" />
                        <label for="titolo_{{ loop.index }}">{{ titolo }}</label>
                    </div>
                    {% endfor %}
                </div>

                <div id="box_altro_titolo" style="display: none; margin-top: 10px">
                    <input type="text" id="titolo_studio_altro" name="titolo_studio_altro" placeholder="Specifica altro titolo di studio..." />
                </div>

                <div class="form-grid">
                    <label>Anno di conseguimento<input type="text" name="anno_diploma" placeholder="Es. 2022" required /></label>
                    <label>Istituto / università<input type="text" name="istituto_formazione" placeholder="Nome dell'istituto" /></label>
                    <label>Voto / valutazione<input type="text" name="voto_formazione" placeholder="Es. 105/110" /></label>
                </div>
                <label>Corsi, certificazioni e formazione aggiuntiva<textarea name="corsi_certificazioni" placeholder="Una voce per riga..."></textarea></label>
            </fieldset>

            <fieldset>
                <legend>Esperienze Lavorative</legend>
                <div class="form-grid">
                    <label>Ultimo ruolo ricoperto<input type="text" name="ultimo_ruolo" placeholder="Es. Product Designer" required /></label>
                    <label>Azienda<input type="text" name="azienda" placeholder="Nome azienda" required /></label>
                    <label>Periodo<input type="text" name="periodo_lavoro" placeholder="Es. 2021 - Presente" required /></label>
                </div>
                <label>Descrizione delle mansioni<textarea name="descrizione_lavoro" placeholder="Responsabilità e risultati ottenuti..." required></textarea></label>
                <label>Esperienze precedenti<textarea name="esperienze_precedenti" placeholder="Ruolo, azienda, periodo e principali attività..."></textarea></label>
                <label>Progetti rilevanti<textarea name="progetti" placeholder="Descrivi progetti personali o professionali..."></textarea></label>
                <label>Volontariato e associazioni<textarea name="volontariato" placeholder="Attività, organizzazione e periodo..."></textarea></label>
            </fieldset>

            <fieldset>
                <legend>Competenze e Altre Informazioni</legend>
                <label>Competenze tecniche<input type="text" name="competenze_tecniche" placeholder="Es. Python, SQL, Excel" required /></label>
                <label>Competenze trasversali<input type="text" name="competenze_trasversali" placeholder="Es. leadership, problem solving, team working" /></label>
                <label>Lingue conosciute<input type="text" name="lingue" placeholder="Es. Italiano C2, Inglese B2" required /></label>
                <div class="form-grid">
                    <label>Patente<input type="text" name="patente" placeholder="Es. B" /></label>
                    <label>Disponibilità<input type="text" name="disponibilita" placeholder="Es. Full-time, trasferte" /></label>
                </div>
                <label>Hobby e interessi<input type="text" name="hobby" placeholder="Es. fotografia, trekking" required /></label>
                <label>Referenze<textarea name="referenze" placeholder="Nome, ruolo e contatto (facoltativo)..."></textarea></label>
            </fieldset>

            <button type="submit">Genera CV</button>
        </form>

        <script></script>
        <script src="{{ url_for('static', filename='script.js') }}"></script>
    </body>
</html>
